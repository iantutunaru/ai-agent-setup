<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>measure.js fixture: labels that wrap their control</title>
<style>
  body { font: 16px/1.4 sans-serif; margin: 24px; }
  label.over { display: grid; gap: 4px; max-width: 320px; margin-bottom: 16px; }
  .fixed-bar { position: fixed; left: 0; right: 0; bottom: 0; height: 60px; background: #eee; }
</style>
</head>
<body>
<form id="part">
  <label class="over">Message <textarea name="message" rows="3">Text typed into the box.</textarea></label>
  <label>City <input type="text" name="city"></label>
</form>
<div class="fixed-bar">A bar fixed to the bottom, outside the form</div>
</body>
</html>
